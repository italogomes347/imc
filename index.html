<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Índice de Massa Corporal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Calculadora de Índice de Massa Corporal</h1>

    <form id="imc-form">
      <label for="peso">Peso (kg)</label>
      <input id="peso" type="number" placeholder="Ex.: 68.5" />

      <label for="altura">Altura (cm)</label>
      <input id="altura" type="number" placeholder="Ex.: 172" />

      <button type="submit">Calcular IMC</button>
    </form>

    <p id="resultado">Preencha os dados para ver o resultado.</p>

    <script src="script.js"></script>
  </body>
</html>
